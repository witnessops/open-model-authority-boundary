[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-model-authority-boundary"
version = "0.1.0"
description = "An AI proposes actions while a deterministic policy retains execution authority."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
transformers = [
    "transformers>=4.40",
    "torch>=2.2",
]

[project.scripts]
oma = "oma.cli:main"

[tool.setuptools]
packages = ["oma"]

[tool.setuptools.package-data]
oma = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
